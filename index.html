<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bóng Cát">
<meta name="theme-color" content="#140a2e">
<link rel="manifest" href="manifest.json">
<title>Bóng Cát Vũ Trụ</title>
<style>
body{margin:0;background:#140a2e;color:#fff;font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 12px 24px;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:420px}
.stat{background:#251845;border-radius:10px;padding:7px 10px}
.stat small{color:#b3a8d6;font-size:12px}
.stat div{font-size:20px;font-weight:600}
#wrap{position:relative;width:100%;max-width:420px;aspect-ratio:4/5;touch-action:none}
#wrap canvas{display:block;width:100%;height:100%;border-radius:12px}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,5,25,.55);border-radius:12px;z-index:2}
#msg{font-size:16px;font-weight:600;text-align:center;padding:0 18px;line-height:1.55}
#lvb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7);opacity:0;transform:scale(.8);transition:all .3s;pointer-events:none;z-index:1;text-align:center}
#fl{position:absolute;inset:0;border-radius:12px;pointer-events:none;opacity:0;z-index:1}
.pp{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7);pointer-events:none;z-index:1;white-space:nowrap;animation:up .9s ease-out forwards}
@keyframes up{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-90%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
button{font-size:22px;border:0;border-radius:10px;background:#352560;color:#fff;touch-action:manipulation}
button:active{background:#4d3a85}
#st{font-size:17px;padding:10px 26px;background:#A05AD8}
#mu{font-size:20px;background:#251845}
#jp{font-size:17px;font-weight:600;background:#A05AD8}
.pad{display:grid;grid-template-columns:60px 84px 60px 60px 48px;grid-template-rows:56px;gap:8px}
#sl{font-size:16px;font-weight:600;background:#C0392B}
#pw{position:absolute;top:8px;left:8px;display:flex;gap:6px;z-index:1;pointer-events:none}
#pw span{background:rgba(20,10,46,.7);border-radius:14px;padding:3px 9px;font-size:15px;font-weight:700}
#msg small{font-size:14px;font-weight:500;color:#d9d0f5}
</style>
</head>
<body>
<div class="stats">
  <div class="stat"><small>Điểm</small><div id="sc">0</div></div>
  <div class="stat"><small>Kỷ lục</small><div id="bs">0</div></div>
  <div class="stat"><small>Màn</small><div id="lv">1</div></div>
  <div class="stat"><small>Mạng</small><div id="lf">❤️3</div></div>
</div>
<div id="wrap">
  <div id="fl"></div>
  <div id="pw"></div>
  <div id="lvb"></div>
  <div id="ov">
    <div id="msg">Phá khối cát <b>cùng màu</b> bóng, né khối khác màu!<br>Qua cổng 🌈 để đổi màu bóng.<br><small>Vuốt ←→ đổi làn · Vuốt ↑ / chạm: nhảy (nhảy 2 lần được!)<br>Đang bay vuốt ↓: <b>ĐẬP ĐẤT</b> phá mọi khối gần đó<br>🛡️ Khiên · 🔥 Bóng lửa · 🧲 Nam châm · 💪 Khổng lồ</small></div>
    <button id="st">Bắt đầu</button>
  </div>
</div>
<div class="pad">
  <button data-m="-1">◀</button><button id="jp">Nhảy</button><button id="sl">Đập</button><button data-m="1">▶</button><button id="mu">🔊</button>
</div>
<script>
(function(){const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');
const gr=g.createLinearGradient(0,0,0,180);gr.addColorStop(0,'#2a1250');gr.addColorStop(1,'#07050f');g.fillStyle=gr;g.fillRect(0,0,180,180);
g.fillStyle='#fff';[[20,20],[150,30],[40,70],[160,90],[100,15],[70,40]].forEach(p=>g.fillRect(p[0],p[1],3,3));
g.fillStyle='#7ccf3e';g.beginPath();g.moveTo(70,100);g.lineTo(110,100);g.lineTo(175,180);g.lineTo(5,180);g.fill();
g.fillStyle='#A05AD8';g.fillRect(100,95,26,24);
g.fillStyle='#E24B4A';g.beginPath();g.arc(80,140,24,0,Math.PI*2);g.fill();
g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.arc(72,132,7,0,Math.PI*2);g.fill();
const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
